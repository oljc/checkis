name: Test

on:
  push:
    branches: ["main"]
    paths:
      - "core/**"
      - "scripts/**"
      - "pnpm-lock.yaml"
      - "package.json"
  pull_request:
    branches: ["*"]
    paths:
      - "core/**"
      - "scripts/**"
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate code
        run: pnpm run gen

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test
